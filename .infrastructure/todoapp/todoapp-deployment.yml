apiVersion: v1
kind: Namespace
metadata:
  name: todoapp
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: todoapp-config
  namespace: todoapp
data:
  DB_HOST: "mysql-external.todo-mysql.svc.cluster.local"
  DB_PORT: "3306"
  DB_NAME: "todoapp"
  DB_USER: "todoapp"
---
apiVersion: v1
kind: Secret
metadata:
  name: todoapp-secret
  namespace: todoapp
type: Opaque
data:
  db-password: dG9kb2FwcA==
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: todoapp-html
  namespace: todoapp
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Advanced ToDo App</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                padding: 20px;
            }
            .container {
                max-width: 900px;
                margin: 0 auto;
                background: rgba(255, 255, 255, 0.95);
                border-radius: 20px;
                box-shadow: 0 20px 40px rgba(0,0,0,0.1);
                padding: 40px;
                backdrop-filter: blur(10px);
            }
            .header {
                text-align: center;
                margin-bottom: 40px;
            }
            h1 {
                color: #333;
                font-size: 2.5em;
                margin-bottom: 10px;
                background: linear-gradient(45deg, #667eea, #764ba2);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }
            .subtitle {
                color: #666;
                font-size: 1.1em;
            }
            .input-section {
                display: flex;
                gap: 15px;
                margin-bottom: 30px;
                flex-wrap: wrap;
            }
            .todo-input {
                flex: 1;
                min-width: 200px;
                padding: 15px 20px;
                border: 2px solid #e0e0e0;
                border-radius: 10px;
                font-size: 16px;
                transition: all 0.3s ease;
            }
            .todo-input:focus {
                outline: none;
                border-color: #667eea;
                box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            }
            .add-btn {
                padding: 15px 30px;
                background: linear-gradient(45deg, #667eea, #764ba2);
                color: white;
                border: none;
                border-radius: 10px;
                font-size: 16px;
                font-weight: 600;
                cursor: pointer;
                transition: transform 0.2s ease;
            }
            .add-btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            }
            .stats {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 20px;
                margin-bottom: 30px;
            }
            .stat-card {
                background: linear-gradient(45deg, #f093fb 0%, #f5576c 100%);
                color: white;
                padding: 20px;
                border-radius: 15px;
                text-align: center;
                box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            }
            .stat-number {
                font-size: 2em;
                font-weight: bold;
                margin-bottom: 5px;
            }
            .stat-label {
                font-size: 0.9em;
                opacity: 0.9;
            }
            .todo-list {
                display: grid;
                gap: 15px;
            }
            .todo-item {
                background: white;
                padding: 20px;
                border-radius: 15px;
                border-left: 5px solid #667eea;
                box-shadow: 0 5px 15px rgba(0,0,0,0.08);
                display: flex;
                justify-content: space-between;
                align-items: center;
                transition: transform 0.2s ease;
            }
            .todo-item:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            }
            .todo-text {
                font-size: 16px;
                color: #333;
                flex: 1;
            }
            .todo-actions {
                display: flex;
                gap: 10px;
            }
            .complete-btn, .delete-btn {
                padding: 8px 16px;
                border: none;
                border-radius: 8px;
                font-size: 14px;
                cursor: pointer;
                transition: all 0.2s ease;
            }
            .complete-btn {
                background: #4CAF50;
                color: white;
            }
            .complete-btn:hover {
                background: #45a049;
            }
            .delete-btn {
                background: #f44336;
                color: white;
            }
            .delete-btn:hover {
                background: #da190b;
            }
            .completed {
                opacity: 0.7;
                text-decoration: line-through;
            }
            .completed .todo-item {
                border-left-color: #4CAF50;
            }
            .status-section {
                margin-top: 30px;
                padding: 25px;
                background: linear-gradient(45deg, #a8edea 0%, #fed6e3 100%);
                border-radius: 15px;
                border: 1px solid rgba(255,255,255,0.2);
            }
            .status-title {
                font-weight: bold;
                color: #333;
                margin-bottom: 10px;
                font-size: 1.2em;
            }
            .status-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 10px;
                margin-top: 15px;
            }
            .status-item {
                background: rgba(255,255,255,0.7);
                padding: 10px;
                border-radius: 8px;
            }
            .empty-state {
                text-align: center;
                padding: 60px 20px;
                color: #666;
            }
            .empty-state-icon {
                font-size: 4em;
                margin-bottom: 20px;
            }
            @media (max-width: 768px) {
                .input-section {
                    flex-direction: column;
                }
                .todo-item {
                    flex-direction: column;
                    gap: 15px;
                    align-items: stretch;
                }
                .todo-actions {
                    justify-content: center;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">
                <h1>🚀 Kubernetes ToDo App</h1>
                <p class="subtitle">Advanced Task Management with MySQL & Node Affinity</p>
            </div>
            
            <div class="input-section">
                <input type="text" id="todoInput" class="todo-input" placeholder="Enter a new task...">
                <button onclick="addTodo()" class="add-btn"> Add Task</button>
            </div>

            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number" id="totalTasks">0</div>
                    <div class="stat-label">Total Tasks</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="completedTasks">0</div>
                    <div class="stat-label">Completed</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="pendingTasks">0</div>
                    <div class="stat-label">Pending</div>
                </div>
            </div>

            <div id="todoList" class="todo-list"></div>

            <div class="status-section">
                <div class="status-title"> System Status</div>
                <div class="status-grid">
                    <div class="status-item">
                        <strong> App Status:</strong> Running on Kubernetes
                    </div>
                    <div class="status-item">
                        <strong> Database:</strong> MySQL StatefulSet
                    </div>
                    <div class="status-item">
                        <strong> Node Affinity:</strong> Scheduled on todoapp nodes
                    </div>
                    <div class="status-item">
                        <strong> Pod Anti-Affinity:</strong> Distributed across nodes
                    </div>
                    <div class="status-item">
                        <strong>️ MySQL Nodes:</strong> Tainted with app=mysql:NoSchedule
                    </div>
                    <div class="status-item">
                        <strong> Replicas:</strong> High Availability Setup
                    </div>
                </div>
            </div>
        </div>

        <script>
            let todos = [];
            let nextId = 1;

            function addTodo() {
                const input = document.getElementById('todoInput');
                const todoText = input.value.trim();
                
                if (todoText === '') {
                    alert('Please enter a task!');
                    return;
                }

                todos.push({
                    id: nextId++,
                    text: todoText,
                    completed: false,
                    createdAt: new Date().toLocaleString()
                });

                input.value = '';
                renderTodos();
                updateStats();
            }

            function toggleComplete(id) {
                const todo = todos.find(t => t.id === id);
                if (todo) {
                    todo.completed = !todo.completed;
                    renderTodos();
                    updateStats();
                }
            }

            function deleteTodo(id) {
                todos = todos.filter(todo => todo.id !== id);
                renderTodos();
                updateStats();
            }

            function updateStats() {
                const total = todos.length;
                const completed = todos.filter(t => t.completed).length;
                const pending = total - completed;

                document.getElementById('totalTasks').textContent = total;
                document.getElementById('completedTasks').textContent = completed;
                document.getElementById('pendingTasks').textContent = pending;
            }

            function renderTodos() {
                const todoList = document.getElementById('todoList');
                
                if (todos.length === 0) {
                    todoList.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📝</div>
                            <h3>No tasks yet!</h3>
                            <p>Add your first task using the input above.</p>
                        </div>
                    `;
                    return;
                }

                todoList.innerHTML = todos.map(todo => `
                    <div class="todo-item ${todo.completed ? 'completed' : ''}">
                        <div class="todo-text">
                            <strong>${todo.text}</strong>
                            <br>
                            <small style="color: #666;">Created: ${todo.createdAt}</small>
                        </div>
                        <div class="todo-actions">
                            <button onclick="toggleComplete(${todo.id})" class="complete-btn">
                                ${todo.completed ? '↩️ Undo' : '✅ Complete'}
                            </button>
                            <button onclick="deleteTodo(${todo.id})" class="delete-btn">
                                🗑️ Delete
                            </button>
                        </div>
                    </div>
                `).join('');
            }

            // Allow Enter key to add todos
            document.getElementById('todoInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addTodo();
                }
            });

            // Initialize
            updateStats();
            renderTodos();

            // Add some demo tasks for demonstration
            setTimeout(() => {
                todos = [
                    { id: 1, text: 'Setup Kubernetes cluster with node affinity', completed: true, createdAt: new Date().toLocaleString() },
                    { id: 2, text: 'Configure MySQL StatefulSet with tolerations', completed: true, createdAt: new Date().toLocaleString() },
                    { id: 3, text: 'Deploy ToDo app with pod anti-affinity', completed: false, createdAt: new Date().toLocaleString() },
                    { id: 4, text: 'Test node taints and scheduling', completed: false, createdAt: new Date().toLocaleString() }
                ];
                nextId = 5;
                renderTodos();
                updateStats();
            }, 1000);
        </script>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todoapp
  namespace: todoapp
  labels:
    app: todoapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: todoapp
  template:
    metadata:
      labels:
        app: todoapp
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: app
                operator: In
                values:
                - todoapp
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: todoapp
              topologyKey: kubernetes.io/hostname
      containers:
      - name: todoapp
        image: nginx:alpine
        ports:
        - containerPort: 80
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: todoapp-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: todoapp-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: todoapp-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: todoapp-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: todoapp-secret
              key: db-password
        volumeMounts:
        - name: html-content
          mountPath: /usr/share/nginx/html
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: html-content
        configMap:
          name: todoapp-html
---
apiVersion: v1
kind: Service
metadata:
  name: todoapp-service
  namespace: todoapp
  labels:
    app: todoapp
spec:
  selector:
    app: todoapp
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: todoapp-external
  namespace: todoapp
  labels:
    app: todoapp
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30000
    protocol: TCP
  selector:
    app: todoapp